allprojects {
    repositories {
        google()
        mavenCentral()
        // Fallback for plugins that still reference jcenter() (#69).
        // usb_serial 0.5.x requires jcenter for dependency resolution.
        //noinspection GradleDeprecated
        jcenter()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    // Provide flutter compilation defaults for plugins whose build.gradle
    // references flutter.compileSdkVersion / flutter.ndkVersion before the
    // Flutter tooling injects it. ndkVersion must be present or plugins such
    // as `jni` fail with "Parameter specified as non-null is null:
    // LibraryExtension.setNdkVersion".
    if (project.name != "app") {
        project.ext.set("flutter", [
            compileSdkVersion: 36,
            minSdkVersion: 29,
            targetSdkVersion: 36,
            ndkVersion: "27.0.12077973"
        ])
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
