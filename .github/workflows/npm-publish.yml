name: Publish npm package

# Publishes openclaw-termux to npm when package.json version changes on main,
# or on demand. The published package lagged the repo by several versions
# because publishing was entirely manual (#99).
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'lib/**'
      - 'bin/**'
      - '.github/workflows/npm-publish.yml'
  workflow_dispatch:

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  publish:
    name: Publish to npm
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Read local version
        id: local
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Read published version
        id: published
        run: |
          PUBLISHED=$(npm view openclaw-termux version 2>/dev/null || echo "none")
          echo "version=$PUBLISHED" >> "$GITHUB_OUTPUT"

      - name: Compare
        id: compare
        run: |
          echo "local=${{ steps.local.outputs.version }} published=${{ steps.published.outputs.version }}"
          if [ "${{ steps.local.outputs.version }}" = "${{ steps.published.outputs.version }}" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.compare.outputs.should_publish == 'true' && env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### npm publish"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Repo version | \`${{ steps.local.outputs.version }}\` |"
            echo "| Published version | \`${{ steps.published.outputs.version }}\` |"
            echo "| Published now | \`${{ steps.compare.outputs.should_publish }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
